# Builds the Flutter web app and publishes it to GitHub Pages together with
# the legal docs from docs/ (their URLs are referenced from the app and the
# store listings, so they must keep working):
#
#   https://pupptmstr.github.io/caliday/app/            ← web app
#   https://pupptmstr.github.io/caliday/PRIVACY_POLICY  ← docs/PRIVACY_POLICY.md
#
# Requires Settings → Pages → Source = "GitHub Actions".
name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Keep in sync with the local Flutter version (pubspec.lock is resolved
      # against its SDK-pinned packages).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.3
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build web --release --base-href /caliday/app/

      - uses: actions/configure-pages@v6

      - name: Build legal docs
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_docs_site

      # The Jekyll container leaves root-owned files, so assemble the final
      # site in a fresh directory instead of writing into its output.
      - name: Assemble site
        run: |
          mkdir _site
          cp -r _docs_site/. _site/
          cp -r build/web _site/app

      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}app/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
