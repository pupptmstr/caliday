<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: a light table. One sticky control bar, then a grid of cards; each
   card is a live stage, a transport row and a strip of key frames. Brand blue
   is the only accent, taken from the app's own palette. */
:root {
  --bg: #f1f4f8;
  --surface: #ffffff;
  --stage: #e2e9f2;
  --fg: #142033;
  --muted: #566780;
  --line: #d2dbe7;
  --accent: #2b7de9;
  --accent-fg: #ffffff;
  --accent-soft: #e2eefc;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a;
    --surface: #161d27;
    --stage: #1a2331;
    --fg: #e7eef8;
    --muted: #8c9db3;
    --line: #263245;
    --accent: #4da6ff;
    --accent-fg: #06111f;
    --accent-soft: #16304d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a;
  --surface: #161d27;
  --stage: #1a2331;
  --fg: #e7eef8;
  --muted: #8c9db3;
  --line: #263245;
  --accent: #4da6ff;
  --accent-fg: #06111f;
  --accent-soft: #16304d;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1280px; margin-inline: auto; padding-inline: 16px; padding-block: 24px 56px; }
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(30px, 5vw, 44px);
  line-height: 1.02;
  text-wrap: balance;
}
.lead { margin: 10px 0 0; max-width: 64ch; color: var(--muted); }

/* Control bar */
.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 22px;
  margin-block: 20px;
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
}
.group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.lbl { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button {
  padding: 6px 12px;
  background: transparent;
  border: 0;
  border-right: 1px solid var(--line);
  cursor: pointer;
}
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 14px;
  background: var(--accent);
  color: var(--accent-fg);
  border: 0;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
}

/* Cards */
.grid {
  --col: 440px;
  --stage-max: 420px;
  display: grid;
  gap: 16px;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--col)), 1fr));
}
.grid[data-size="s"] { --col: 170px; --stage-max: 136px; }
.grid[data-size="m"] { --col: 290px; --stage-max: 250px; }
.grid[data-size="l"] { --col: 440px; --stage-max: 420px; }
.card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
  padding: 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
}
.stage {
  width: 100%;
  max-width: var(--stage-max);
  margin-inline: auto;
  aspect-ratio: 1;
  background: var(--stage);
  border-radius: 10px;
  overflow: hidden;
}
h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 24px;
  line-height: 1.1;
  text-wrap: balance;
}
.id { margin: 2px 0 0; font: 12px var(--font-mono); color: var(--muted); overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.chips li {
  padding: 2px 8px;
  background: var(--accent-soft);
  color: var(--fg);
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
}
.desc { margin: 0; color: var(--muted); }

.transport { display: flex; align-items: center; gap: 10px; }
.play {
  display: grid;
  place-items: center;
  flex: none;
  width: 34px;
  height: 34px;
  background: var(--accent-soft);
  border: 0;
  border-radius: 50%;
  color: var(--accent);
  cursor: pointer;
}
.transport input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); }
.time { flex: none; min-width: 9.5ch; text-align: right; font: 12px var(--font-mono); font-variant-numeric: tabular-nums; color: var(--muted); }

.strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.thumb {
  position: relative;
  padding: 0;
  background: var(--stage);
  border: 2px solid transparent;
  border-radius: 8px;
  overflow: hidden;
  cursor: pointer;
}
.thumb.on { border-color: var(--accent); }
.thumb .mini {
  aspect-ratio: 1;
  pointer-events: none;
  /* Crop the empty canvas around Goro so poses stay readable in a thumbnail. */
  transform: scale(1.5);
  transform-origin: 50% 90%;
}
.thumb .n {
  position: absolute;
  left: 3px;
  bottom: 2px;
  padding: 0 3px;
  background: var(--surface);
  border-radius: 3px;
  font: 10px var(--font-mono);
  color: var(--muted);
}
.grid.no-strip .strip { display: none; }
.grid[data-size="s"] .strip, .grid[data-size="s"] .desc { display: none; }
.grid[data-size="s"] .card { padding: 10px; gap: 8px; }
.grid[data-size="s"] h2 { font-size: 18px; }
.grid[data-size="s"] .chips, .grid[data-size="s"] .id { display: none; }
.grid[data-size="s"] .time { display: none; }

.note { margin: 28px 0 0; max-width: 70ch; font-size: 13px; color: var(--muted); }
.fail { padding: 20px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); }

@media (max-width: 700px) {
  .bar { position: static; gap: 12px 16px; }
  .seg button { padding: 6px 8px; font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto; }
}
</style>

<main class="wrap">
  <header>
    <h1>__H1__</h1>
    <p class="lead">__LEAD__</p>
  </header>

  <div class="bar" role="toolbar" aria-label="Управление просмотром">
    <button class="btn" id="playAll" type="button"></button>
    <div class="group">
      <span class="lbl" id="speedLbl">Скорость</span>
      <div class="seg" role="group" aria-labelledby="speedLbl" id="speedSeg">
        <button type="button" data-v="0.5" aria-pressed="false">0,5×</button>
        <button type="button" data-v="1" aria-pressed="false">1×</button>
        <button type="button" data-v="1.5" aria-pressed="false">1,5×</button>
      </div>
    </div>
    <div class="group">
      <span class="lbl" id="sizeLbl">Размер</span>
      <div class="seg" role="group" aria-labelledby="sizeLbl" id="sizeSeg">
        <button type="button" data-v="s" aria-pressed="false">Миниатюра</button>
        <button type="button" data-v="m" aria-pressed="false">Экран</button>
        <button type="button" data-v="l" aria-pressed="false">Крупно</button>
      </div>
    </div>
    <div class="group">
      <span class="lbl" id="stripLbl">Раскадровка</span>
      <div class="seg" role="group" aria-labelledby="stripLbl" id="stripSeg">
        <button type="button" data-v="1" aria-pressed="false">Вкл</button>
        <button type="button" data-v="0" aria-pressed="false">Выкл</button>
      </div>
    </div>
  </div>

  <section class="grid" id="grid" data-size="l" aria-label="Анимации"></section>

  <p class="note">Страница играет файлы через lottie-web (SVG). В приложении те же файлы рисует Flutter-плагин lottie, картинка совпадает с точностью до сглаживания. Источник анимаций: tools/lottie.</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<script>
const META = __META__;
const DATA = __DATA__;

const $ = (sel, root = document) => root.querySelector(sel);
const store = {
  get(key, fallback) {
    try {
      const raw = localStorage.getItem('flexstand.' + key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (e) { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem('flexstand.' + key, JSON.stringify(value)); } catch (e) {}
  },
};
const clone = (o) => JSON.parse(JSON.stringify(o));
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const SPEEDS = [0.5, 1, 1.5];
const SIZES = ['s', 'm', 'l'];
const state = {
  playing: !reduceMotion,
  speed: SPEEDS.includes(store.get('speed', 1)) ? store.get('speed', 1) : 1,
  size: SIZES.includes(store.get('size', 'l')) ? store.get('size', 'l') : 'l',
  strip: store.get('strip', true) !== false,
};

const ICON_PLAY = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';

const grid = $('#grid');
const cards = [];

function seconds(frame, fps) {
  return (frame / fps).toFixed(1).replace('.', ',');
}

function setPlaying(card, on) {
  card.playing = on;
  if (on) card.anim.play(); else card.anim.pause();
  card.playBtn.innerHTML = on ? ICON_PAUSE : ICON_PLAY;
  card.playBtn.setAttribute('aria-label', on ? 'Пауза' : 'Играть');
}

function showFrame(card) {
  const f = Math.round(card.anim.currentFrame);
  if (f === card.last) return;
  card.last = f;
  card.range.value = f;
  card.time.textContent = 'кадр ' + f + '/' + card.frames + ' · ' + seconds(f, card.fps) + ' с';
  const idx = Math.min(card.thumbs.length - 1, Math.floor((f / card.frames) * card.thumbs.length));
  if (idx !== card.lit) {
    if (card.lit >= 0) card.thumbs[card.lit].classList.remove('on');
    card.thumbs[idx].classList.add('on');
    card.lit = idx;
  }
}

function makeCard(info) {
  const data = DATA[info.id];
  const frames = data.op - data.ip;
  const el = document.createElement('article');
  el.className = 'card';
  el.innerHTML =
    '<div class="stage"></div>' +
    '<div><h2></h2><p class="id"></p></div>' +
    '<ul class="chips"></ul>' +
    '<p class="desc"></p>' +
    '<div class="transport">' +
      '<button class="play" type="button"></button>' +
      '<input type="range" min="0" step="1" value="0">' +
      '<span class="time"></span>' +
    '</div>' +
    '<div class="strip"></div>';
  $('h2', el).textContent = info.title;
  $('.id', el).textContent = info.id;
  $('.desc', el).textContent = info.text;
  const chips = $('.chips', el);
  [info.stage, info.kind, frames + ' кадров · ' + seconds(frames, data.fr) + ' с'].forEach((t) => {
    const li = document.createElement('li');
    li.textContent = t;
    chips.appendChild(li);
  });

  const anim = lottie.loadAnimation({
    container: $('.stage', el),
    renderer: 'svg',
    loop: true,
    autoplay: false,
    animationData: clone(data),
    rendererSettings: { preserveAspectRatio: 'xMidYMid meet' },
  });
  anim.setSpeed(state.speed);

  const range = $('input', el);
  range.max = frames;
  range.setAttribute('aria-label', 'Кадр: ' + info.title);

  const card = {
    anim, frames, fps: data.fr, el, range,
    playBtn: $('.play', el), time: $('.time', el),
    thumbs: [], lit: -1, last: -1, playing: false,
  };

  const strip = $('.strip', el);
  const count = 6;
  for (let i = 0; i < count; i++) {
    const frame = Math.round((frames * i) / count);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'thumb';
    btn.setAttribute('aria-label', 'Кадр ' + frame + ': ' + info.title);
    btn.innerHTML = '<div class="mini"></div><span class="n">' + frame + '</span>';
    strip.appendChild(btn);
    const mini = lottie.loadAnimation({
      container: $('.mini', btn),
      renderer: 'svg',
      loop: false,
      autoplay: false,
      animationData: clone(data),
      rendererSettings: { preserveAspectRatio: 'xMidYMid meet' },
    });
    mini.goToAndStop(frame, true);
    btn.addEventListener('click', () => {
      setPlaying(card, false);
      anim.goToAndStop(frame, true);
    });
    card.thumbs.push(btn);
  }

  card.playBtn.addEventListener('click', () => setPlaying(card, !card.playing));
  range.addEventListener('input', () => {
    setPlaying(card, false);
    anim.goToAndStop(+range.value, true);
  });
  anim.addEventListener('enterFrame', () => showFrame(card));
  anim.addEventListener('DOMLoaded', () => {
    setPlaying(card, state.playing);
    showFrame(card);
  });

  grid.appendChild(el);
  return card;
}

function pressed(group, value) {
  group.querySelectorAll('button').forEach((b) => {
    b.setAttribute('aria-pressed', String(b.dataset.v === String(value)));
  });
}

function syncBar() {
  const play = $('#playAll');
  play.innerHTML = (state.playing ? ICON_PAUSE : ICON_PLAY) + '<span>' + (state.playing ? 'Остановить все' : 'Запустить все') + '</span>';
  pressed($('#speedSeg'), state.speed);
  pressed($('#sizeSeg'), state.size);
  pressed($('#stripSeg'), state.strip ? 1 : 0);
  grid.dataset.size = state.size;
  grid.classList.toggle('no-strip', !state.strip);
}

function setAll(on) {
  state.playing = on;
  cards.forEach((c) => setPlaying(c, on));
  syncBar();
}

if (typeof lottie === 'undefined') {
  grid.innerHTML = '<p class="fail">Не удалось загрузить lottie-web с cdnjs. Проверьте соединение и обновите страницу.</p>';
  syncBar();
} else {
  META.forEach((info) => cards.push(makeCard(info)));
  syncBar();

  $('#playAll').addEventListener('click', () => setAll(!state.playing));
  $('#speedSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    state.speed = +b.dataset.v;
    store.set('speed', state.speed);
    cards.forEach((c) => c.anim.setSpeed(state.speed));
    syncBar();
  });
  $('#sizeSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    state.size = b.dataset.v;
    store.set('size', state.size);
    syncBar();
  });
  $('#stripSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    state.strip = b.dataset.v === '1';
    store.set('strip', state.strip);
    syncBar();
  });
  document.addEventListener('keydown', (e) => {
    if (e.code !== 'Space' || e.target.closest('button, input')) return;
    e.preventDefault();
    setAll(!state.playing);
  });
}
</script>
